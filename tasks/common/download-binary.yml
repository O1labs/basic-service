---
- name: Ensure destination directory exists [{{ destination_directory }}]
  ansible.builtin.file:
    path: "{{ destination_directory }}"
    state: directory
    mode: "0755"

- name: Set binary file name and paths for [{{ binary_url }}]
  vars:
    _binary_name: >-
      {{ binary_file_name_override | default('', true) | default(binary_url | basename, true) }}
    _binary_file_name: >-
      {{ binary_url | basename }}
    _binary_is_archive: >-
      {{ (binary_url | basename) is regex('\.(tar|tar\.gz|tgz|zip)$') }}
  ansible.builtin.set_fact:
    binary_file_name: "{{ _binary_file_name }}"
    binary_file_path: "/tmp/{{ _binary_file_name }}"
    target_binary_path: "{{ [destination_directory, _binary_name] | path_join }}"
    binary_is_archive: "{{ _binary_is_archive }}"

- name: Download the binary file to [{{ target_binary_path }}]
  ansible.builtin.get_url:
    url: "{{ binary_url }}"
    dest: "{{ target_binary_path }}"
    mode: "0755"
  when: not binary_is_archive | bool

- name: Download archive to [{{ binary_file_path }}]
  ansible.builtin.get_url:
    url: "{{ binary_url }}"
    dest: "{{ binary_file_path }}"
    mode: "0755"
  when: binary_is_archive | bool

- name: Extract archive into [{{ destination_directory }}]
  ansible.builtin.unarchive:
    src: "{{ binary_file_path }}"
    dest: "{{ destination_directory }}"
    remote_src: true
    extra_opts:
      - "--strip-components={{ binary_strip_components }}"
  when: binary_is_archive | bool

- name: Check if the binary override file exists at [{{ destination_directory }}]
  ansible.builtin.stat:
    path: "{{ destination_directory }}/{{ binary_file_name_override }}"
  register: binary_override_file_stat
  when:
    - binary_file_name_override | default('', true) | length > 0
    - binary_url | default('', true) | length > 0

- name: Fail if override binary file is missing at [{{ destination_directory }}]
  ansible.builtin.fail:
    msg: "The binary file does not exist at {{ destination_directory }}/{{ binary_file_name_override }}."
  when:
    - binary_file_name_override | default('', true) | length > 0
    - binary_url | default('', true) | length > 0
    - not binary_override_file_stat.stat.exists
