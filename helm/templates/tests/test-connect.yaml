apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "basic-service.fullname" . }}-test-connection"
  labels:
    {{- include "basic-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl
      command: ['curl']
      args:
        - --location
        - --request
        - GET
        - '{{ include "basic-service.fullname" . }}:{{ .Values.servicePort }}/'
  restartPolicy: Never
