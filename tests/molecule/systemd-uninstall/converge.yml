---
# Three plays: install the service, seed a drop-in that the role did not write,
# then uninstall. This gives teardown a drop-in to clean up, which the previous
# single-play scenario could not express.
- name: Install
  hosts: all
  become: true
  roles:
    - role: basic-service
      vars:
        uninstall: false
        setup_mode: systemd
        name: sample-service
        user: root
        binary_url: https://github.com/prometheus/prometheus/releases/download/v2.47.0/prometheus-2.47.0.linux-amd64.tar.gz
        binary_strip_components: 1
        destination_directory: /usr/bin
        binary_file_name_override: prometheus
        command: /usr/bin/prometheus --config.file=/test/mnt/etc/prometheus/prometheus.yml
        cpus: 50
        memory: 512M
        config:
          prometheus.yml:
            destinationPath: /etc/prometheus/prometheus.yml
            data: |
              global:
                scrape_interval: 15s
                evaluation_interval: 15s
              scrape_configs:
                - job_name: prometheus
                  static_configs:
                    - targets: ["localhost:9090"]
        config_env:
          PROMETHEUS_STORAGE_PATH: /prometheus
        host_data_dir: /test/mnt
        data_dirs:
          prometheus_data:
            hostPath: /var/tmp/prometheus
            appPath: /var/tmp/prometheus
        restart_policy: on-failure

- name: Seed a drop-in that uninstall must remove
  hosts: all
  become: true
  tasks:
    - name: Create the drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/sample-service.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Seed a stale drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/sample-service.service.d/stale.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          CPUQuota=400%

- name: Uninstall
  hosts: all
  become: true
  roles:
    - role: basic-service
      vars:
        uninstall: true
        setup_mode: systemd
        name: sample-service
        user: root
        binary_url: https://github.com/prometheus/prometheus/releases/download/v2.47.0/prometheus-2.47.0.linux-amd64.tar.gz
        binary_strip_components: 1
        destination_directory: /usr/bin
        binary_file_name_override: prometheus
        command: /usr/bin/prometheus --config.file=/test/mnt/etc/prometheus/prometheus.yml
        cpus: 50
        memory: 512M
        config:
          prometheus.yml:
            destinationPath: /etc/prometheus/prometheus.yml
            data: |
              global:
                scrape_interval: 15s
                evaluation_interval: 15s
              scrape_configs:
                - job_name: prometheus
                  static_configs:
                    - targets: ["localhost:9090"]
        config_env:
          PROMETHEUS_STORAGE_PATH: /prometheus
        host_data_dir: /test/mnt
        data_dirs:
          prometheus_data:
            hostPath: /var/tmp/prometheus
            appPath: /var/tmp/prometheus
        restart_policy: on-failure
