name: Galaxy Import

on:
  # Manual tag pushes
  push:
    tags:
      - "v*"
  # semantic-release uses GITHUB_TOKEN, which does not re-trigger tag pushes
  release:
    types: [published]
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pin: "3.x" resolves to 3.15, where ansible-core fails to import.
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Import role to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "$GALAXY_API_KEY" ]; then
            echo "GALAXY_API_KEY secret is not set" >&2
            exit 1
          fi
          # Omit namespace from meta (0x0i fails lint); keeps the 0x0i listing
          ansible-galaxy role import 0x0I basic-service --token "$GALAXY_API_KEY"
