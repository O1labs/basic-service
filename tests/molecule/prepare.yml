---
- name: Ensure test-dependencies are installed
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure apt is updated
      raw: apt-get update
      register: apt_update
      retries: 10
      delay: 3
      until: apt_update.rc == 0

    - name: Install system dependencies (sudo, Python, pip)
      raw: >-
        apt-get install -y --no-install-recommends
        sudo python3 python3-pip iptables
      register: apt_install
      retries: 10
      delay: 3
      until: apt_install.rc == 0

    - name: Install python dependencies
      # --break-system-packages only exists from pip 23.0, so older images
      # (Ubuntu 22.04 ships pip 22.0.2) must fall back to plain pip.
      raw: >-
        pip3 install --ignore-installed PyYAML pytest-testinfra molecule-docker
        $([ "$(pip3 --version | sed -E 's/^pip ([0-9]+).*/\1/')" -ge 23 ] && echo --break-system-packages)
      register: pip_install
      retries: 5
      delay: 3
      until: pip_install.rc == 0
